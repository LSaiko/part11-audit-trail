[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "part11-audit-trail"
version = "0.1.0"
description = "21 CFR Part 11 tamper-evident hash-chained audit trail and e-signature workflow grounded in ALCOA+"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
    "cryptography==50.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mypy==2.3.1",
    "ruff==0.16.8",
    "httpx==0.28.1",
]

[tool.setuptools]
packages = ["app", "crypto", "schemas"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
